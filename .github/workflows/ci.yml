# CI — run the offline test suite on every push/PR.
# Pure Python stdlib, zero network: proves the "offline & green" claim.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run offline tests (no network, stdlib only)
        env:
          NEXUS_AI: stub
        run: python -m unittest discover tests -v
